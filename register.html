
<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Curve &amp; Co.</title>
    <link
    rel="icon"
    type="image/png"
    href="images/logo.png"
>


    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/register.css">
    <link rel="stylesheet" href="css/register-responsive.css">
</head>

<body class="cc-register-page">

    <!-- TOP CONTROLS -->
    <div class="cc-register-top-controls">

        <!-- RTL TOGGLE -->
        <button
            type="button"
            class="cc-register-control-btn"
            data-curve-rtl
            aria-label="Toggle right-to-left layout"
            aria-pressed="false"
            title="Toggle RTL">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 aria-hidden="true">
                <path d="M4 8h15"/>
                <path d="m15 4 4 4-4 4"/>
                <path d="M20 16H5"/>
                <path d="m9 12-4 4 4 4"/>
            </svg>
        </button>

        <!-- DARK MODE TOGGLE -->
        <button
            type="button"
            class="cc-register-control-btn"
            data-curve-theme
            aria-label="Toggle dark mode"
            aria-pressed="false"
            title="Toggle dark mode">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 aria-hidden="true">
                <path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5
                         8.5 8.5 0 1 0 20.5 15.5Z"/>
            </svg>
        </button>

    </div>

    <!-- REGISTER MAIN -->
    <main class="cc-register-main">

        <!-- SINGLE REGISTER CARD -->
        <section class="cc-register-card"
                 aria-labelledby="ccRegisterTitle">

            <!-- BRAND LOGO -->
            <div class="cc-register-logo">
                <a href="index.html" aria-label="Curve and Co. Home">
                    <img src="images/logo.png"
                         alt="Curve &amp; Co. Logo">
                </a>
            </div>

            <!-- WELCOME BADGE -->
            <div class="cc-register-badge-wrap">
                <span class="cc-register-badge">
                    JOIN OUR COMMUNITY
                </span>
            </div>

            <!-- PAGE HEADER -->
            <header class="cc-register-header">

                <h1 class="cc-register-title" id="ccRegisterTitle">
                    Create Your
                    <span>Account</span>
                </h1>

                <p class="cc-register-description">
                    Discover your style, save your favourites,
                    and enjoy a shopping experience made just for you.
                </p>

            </header>

            <!-- REGISTER FORM -->
            <form class="cc-register-form"
                  id="ccRegisterForm"
                  action="#"
                  method="post">

                <!-- FULL NAME -->
                <div class="cc-register-form-group">
                    <label for="ccRegisterName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="ccRegisterName"
                        name="full_name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required>
                </div>

                <!-- EMAIL -->
                <div class="cc-register-form-group">
                    <label for="ccRegisterEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="ccRegisterEmail"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required>
                </div>

                <!-- PHONE NUMBER -->
                <div class="cc-register-form-group">
                    <label for="ccRegisterPhone">
                        Phone Number
                        <span class="cc-register-optional">
                            (Optional)
                        </span>
                    </label>

                    <input
                        type="tel"
                        id="ccRegisterPhone"
                        name="phone"
                        placeholder="Enter your phone number"
                        autocomplete="tel">
                </div>

                <!-- PASSWORD -->
                <div class="cc-register-form-group">
                    <label for="ccRegisterPassword">
                        Password
                    </label>

                    <div class="cc-register-password-wrap">

                        <input
                            type="password"
                            id="ccRegisterPassword"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="8"
                            required>

                        <button
                            type="button"
                            class="cc-register-password-toggle"
                            data-password-target="ccRegisterPassword"
                            aria-label="Show password"
                            aria-pressed="false">

                            <svg viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="1.8"
                                 stroke-linecap="round"
                                 stroke-linejoin="round"
                                 aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7
                                         10 7 10 7-3.5 7-10 7
                                         S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>

                        </button>
                    </div>

                    <small class="cc-register-field-note">
                        Use at least 8 characters.
                    </small>
                </div>

                <!-- CONFIRM PASSWORD -->
                <div class="cc-register-form-group">
                    <label for="ccRegisterConfirmPassword">
                        Confirm Password
                    </label>

                    <div class="cc-register-password-wrap">

                        <input
                            type="password"
                            id="ccRegisterConfirmPassword"
                            name="confirm_password"
                            placeholder="Re-enter your password"
                            autocomplete="new-password"
                            minlength="8"
                            required>

                        <button
                            type="button"
                            class="cc-register-password-toggle"
                            data-password-target="ccRegisterConfirmPassword"
                            aria-label="Show confirm password"
                            aria-pressed="false">

                            <svg viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="1.8"
                                 stroke-linecap="round"
                                 stroke-linejoin="round"
                                 aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7
                                         10 7 10 7-3.5 7-10 7
                                         S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>

                        </button>
                    </div>
                </div>

                <!-- TERMS -->
                <div class="cc-register-terms-wrap">

                    <label class="cc-register-terms">
                        <input
                            type="checkbox"
                            id="ccRegisterTerms"
                            name="terms"
                            required>

                        <span>
                            I agree to the
                            <a href="terms.html">Terms &amp; Conditions</a>
                            and
                            <a href="privacy.html">Privacy Policy</a>.
                        </span>
                    </label>

                </div>

                <!-- SUBMIT -->
                <button type="submit" class="cc-register-submit">
                    Create Account
                </button>

                <!-- FORM FEEDBACK -->
                <p class="cc-register-feedback"
                   id="ccRegisterFeedback"
                   role="status"
                   aria-live="polite"></p>

            </form>

            <!-- SOCIAL DIVIDER -->
            <div class="cc-register-divider">
                <span aria-hidden="true"></span>
                <p>or sign up with</p>
                <span aria-hidden="true"></span>
            </div>

            <!-- SOCIAL SIGN-UP -->
            <div class="cc-register-social">

                <!-- GOOGLE -->
                <button
                    type="button"
                    class="cc-register-social-btn"
                    aria-label="Sign up with Google">

                    <svg viewBox="0 0 48 48"
                         aria-hidden="true">
                        <path fill="#EA4335"
                              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/>
                        <path fill="#4285F4"
                              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.76 7.18l7.73 6C44.42 37.93 46.98 31.7 46.98 24.55Z"/>
                        <path fill="#FBBC05"
                              d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.55 2.56 10.78l7.97-6.19Z"/>
                        <path fill="#34A853"
                              d="M24 48c6.48 0 11.94-2.13 15.91-5.8l-7.73-6c-2.14 1.44-4.88 2.3-8.18 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/>
                    </svg>

                </button>

                <!-- FACEBOOK -->
                <button
                    type="button"
                    class="cc-register-social-btn"
                    aria-label="Sign up with Facebook">

                    <svg viewBox="0 0 24 24"
                         aria-hidden="true">
                        <circle cx="12" cy="12" r="11" fill="#1877F2"/>
                        <path fill="#FFFFFF"
                              d="M14.3 8.2h1.6V5.5c-.3 0-1.2-.1-2.3-.1-2.3 0-3.8 1.4-3.8 4v2.2H7.3v3h2.5V22h3.1v-7.4h2.5l.4-3h-2.9V9.7c0-.9.2-1.5 1.4-1.5Z"/>
                    </svg>

                </button>

                <!-- APPLE -->
                <button
                    type="button"
                    class="cc-register-social-btn cc-register-apple"
                    aria-label="Sign up with Apple">

                    <svg viewBox="0 0 24 24"
                         fill="currentColor"
                         aria-hidden="true">
                        <path d="M17.05 12.54c.02 2.05 1.8 2.73 1.82 2.74-.02.05-.28 1-.94 1.97-.57.84-1.17 1.67-2.1 1.69-.91.02-1.2-.55-2.24-.55-1.03 0-1.36.53-2.22.57-.9.03-1.59-.91-2.17-1.75-1.18-1.71-2.08-4.83-.87-6.93a3.36 3.36 0 0 1 2.82-1.72c.88-.02 1.72.61 2.26.61.53 0 1.54-.76 2.6-.65.44.02 1.67.18 2.46 1.34-.06.04-1.47.86-1.45 2.56ZM14.9 6.25A3.4 3.4 0 0 0 15.68 3.8a3.46 3.46 0 0 0-2.24 1.16 3.25 3.25 0 0 0-.8 2.37 2.87 2.87 0 0 0 2.26-1.08Z"/>
                    </svg>

                </button>

            </div>

            <!-- LOGIN LINK -->
            <div class="cc-register-login-link">
                <p>
                    Already have an account?
                    <a href="login.html">Sign In</a>
                </p>
            </div>

        </section>

    </main>

    <!-- EXISTING GLOBAL SCRIPT -->
    <script src="js/main.js" defer></script>

    

</body>
</html>
