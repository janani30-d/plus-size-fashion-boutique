
<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Curve &amp; Co.</title>
    <link
    rel="icon"
    type="image/png"
    href="images/logo.png"
>


    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="cc-login-page">

    <!-- THEME CONTROLS -->
    <div class="cc-login-top-controls">

        <!-- RTL -->

                <button
                    type="button"
                    class="curve-icon-btn curve-rtl-toggle"
                    data-curve-rtl
                    aria-label="Toggle right-to-left layout"
                    aria-pressed="false"
                    title="Toggle RTL"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 8h15"/>
                        <path d="m15 4 4 4-4 4"/>
                        <path d="M20 16H5"/>
                        <path d="m9 12-4 4 4 4"/>
                    </svg>
                </button>


                <!-- DARK MODE -->

                <button
                    type="button"
                    class="curve-icon-btn curve-theme-toggle"
                    data-curve-theme
                    aria-label="Toggle dark mode"
                    aria-pressed="false"
                    title="Toggle dark mode"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5
                            8.5 8.5 0 1 0 20.5 15.5Z"
                        />
                    </svg>
                </button>


    </div>

    <!-- LOGIN MAIN -->
    <main class="cc-login-main">

        <!-- SINGLE LOGIN CARD -->
        <section class="cc-login-card" aria-labelledby="ccLoginTitle">

            <!-- BRAND LOGO -->
            <div class="cc-login-logo">
                <a href="index.html" aria-label="Curve and Co. Home">
                    <img src="images/logo.png" alt="Curve &amp; Co. Logo">
                </a>
            </div>

            <!-- CENTERED WELCOME BADGE -->
            <div class="cc-login-badge-wrap">
                <span class="cc-login-welcome">Welcome Back</span>
            </div>

            <!-- HEADER -->
            <header class="cc-login-header">

                <h1 class="cc-login-title" id="ccLoginTitle">
                    Sign In to Your
                    <span>Account</span>
                </h1>

                <p class="cc-login-description">
                    Sign in to explore your favourite styles,
                    manage your orders, and enjoy a shopping
                    experience made just for you.
                </p>

            </header>

            <!-- LOGIN FORM -->
            <form class="cc-login-form"
                  id="ccLoginForm"
                  action="#"
                  method="post">

                <!-- EMAIL -->
                <div class="cc-login-form-group">
                    <label for="ccLoginEmail">Email Address</label>

                    <input
                        type="email"
                        id="ccLoginEmail"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required>
                </div>

                <!-- PASSWORD -->
                <div class="cc-login-form-group">
                    <label for="ccLoginPassword">Password</label>

                    <div class="cc-login-password-wrap">

                        <input
                            type="password"
                            id="ccLoginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            class="cc-login-password-toggle"
                            id="ccLoginPasswordToggle"
                            aria-label="Show password"
                            aria-pressed="false"
                            aria-controls="ccLoginPassword">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                 width="20" height="20"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="1.8"
                                 stroke-linecap="round"
                                 stroke-linejoin="round"
                                 aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7
                                         10 7 10 7-3.5 7-10 7
                                         S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>

                        </button>
                    </div>
                </div>

                <!-- REMEMBER / FORGOT -->
                <div class="cc-login-options">

                    <label class="cc-login-remember">
                        <input
                            type="checkbox"
                            id="ccLoginRemember"
                            name="remember">
                        <span>Remember me</span>
                    </label>

                    <a href="forgot-password.html"
                       class="cc-login-forgot">
                        Forgot Password?
                    </a>

                </div>

                <!-- SIGN IN BUTTON -->
                <button type="submit" class="cc-login-submit">
                    Sign In
                </button>

                <!-- FORM FEEDBACK -->
                <p class="cc-login-feedback"
                   id="ccLoginFeedback"
                   role="status"
                   aria-live="polite"></p>

            </form>

            <!-- CENTERED SOCIAL DIVIDER -->
            <div class="cc-login-divider">
                <span class="cc-login-divider-line" aria-hidden="true"></span>
                <p>or continue with</p>
                <span class="cc-login-divider-line" aria-hidden="true"></span>
            </div>

            <!-- SOCIAL LOGIN ICONS -->
            <div class="cc-login-social">

                <!-- GOOGLE -->
                <button type="button"
                        class="cc-login-social-btn cc-login-google"
                        aria-label="Continue with Google">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         width="22" height="22"
                         viewBox="0 0 48 48"
                         aria-hidden="true">
                        <path fill="#EA4335"
                              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/>
                        <path fill="#4285F4"
                              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.76 7.18l7.73 6C44.42 37.93 46.98 31.7 46.98 24.55Z"/>
                        <path fill="#FBBC05"
                              d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.55 2.56 10.78l7.97-6.19Z"/>
                        <path fill="#34A853"
                              d="M24 48c6.48 0 11.94-2.13 15.91-5.8l-7.73-6c-2.14 1.44-4.88 2.3-8.18 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/>
                    </svg>
                </button>

                <!-- FACEBOOK -->
                <button type="button"
                        class="cc-login-social-btn cc-login-facebook"
                        aria-label="Continue with Facebook">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         width="22" height="22"
                         viewBox="0 0 24 24"
                         aria-hidden="true">
                        <circle cx="12" cy="12" r="11" fill="#1877F2"/>
                        <path fill="#FFFFFF"
                              d="M14.3 8.2h1.6V5.5c-.3 0-1.2-.1-2.3-.1-2.3 0-3.8 1.4-3.8 4v2.2H7.3v3h2.5V22h3.1v-7.4h2.5l.4-3h-2.9V9.7c0-.9.2-1.5 1.4-1.5Z"/>
                    </svg>
                </button>

                <!-- APPLE -->
                <button type="button"
                        class="cc-login-social-btn cc-login-apple"
                        aria-label="Continue with Apple">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         width="22" height="22"
                         viewBox="0 0 24 24"
                         fill="currentColor"
                         aria-hidden="true">
                        <path d="M17.05 12.54c.02 2.05 1.8 2.73 1.82 2.74-.02.05-.28 1-.94 1.97-.57.84-1.17 1.67-2.1 1.69-.91.02-1.2-.55-2.24-.55-1.03 0-1.36.53-2.22.57-.9.03-1.59-.91-2.17-1.75-1.18-1.71-2.08-4.83-.87-6.93a3.36 3.36 0 0 1 2.82-1.72c.88-.02 1.72.61 2.26.61.53 0 1.54-.76 2.6-.65.44.02 1.67.18 2.46 1.34-.06.04-1.47.86-1.45 2.56ZM14.9 6.25A3.4 3.4 0 0 0 15.68 3.8a3.46 3.46 0 0 0-2.24 1.16 3.25 3.25 0 0 0-.8 2.37 2.87 2.87 0 0 0 2.26-1.08Z"/>
                    </svg>
                </button>

            </div>

            <!-- REGISTER LINK -->
            <div class="cc-login-register">
                <p>
                    Don't have an account?
                    <a href="register.html">Create Account</a>
                </p>
            </div>

        </section>

    </main>

    <!-- EXISTING GLOBAL SCRIPT -->
    <script src="js/main.js" defer></script>

</body>
</html>
